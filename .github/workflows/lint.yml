name: Lint & Type Check

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r web/backend/requirements.txt
          pip install mypy types-PyYAML types-beautifulsoup4 types-requests
      - name: Copy config for import resolution
        run: cp config/config-example.yaml config/config.yaml
      - name: Run mypy on new backend/ and connectors/ packages
        run: |
          mypy backend/ connectors/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --follow-imports=silent \
            --exclude '(test_.*\.py|conftest\.py)$' \
            --disable-error-code=untyped-decorator \
            --disable-error-code=no-any-return
