name: Lint & Type Check

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Ruff + mypy checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r web/backend/requirements.txt -r requirements-dev.txt

      - name: Ruff lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Copy config for import resolution
        run: cp config/config-example.yaml config/config.yaml

      - name: Run mypy on new backend/ and connectors/ packages
        run: |
          mypy backend/ connectors/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --follow-imports=silent \
            --exclude '(test_.*\.py|conftest\.py)$' \
            --disable-error-code=no-any-return

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high
