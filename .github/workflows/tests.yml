name: Run Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install --constraint constraints.txt -e ".[bot,backend]"
          pip-audit --skip-editable --desc on

  test-native:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Make sure bot.py sees a token so it doesn't raise
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN || 'test-token' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'constraints.txt', 'requirements*.txt', 'web/backend/requirements.txt') }}-py312
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r web/backend/requirements.txt -r requirements-dev.txt

      - name: Copy example config for tests
        run: |
          mkdir -p config
          cp config/config-example.yaml config/config.yaml

      - name: Enforce Python modularity thresholds
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            CHANGED_PY_FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}..HEAD" -- '*.py' || true)
          else
            CHANGED_PY_FILES=$(git diff --name-only --diff-filter=AM "HEAD~1..HEAD" -- '*.py' || true)
          fi

          if [ -z "$CHANGED_PY_FILES" ]; then
            echo "No changed Python files to check."
            exit 0
          fi

          python3 tools/check_modularity.py \
            --warn-lines 500 \
            --fail-lines 700 \
            --warn-funcs 15 \
            --warn-classes 4 \
            $CHANGED_PY_FILES

      - name: Run tests with coverage
        run: |
          pytest -q -vv --maxfail=1 --durations=20 --timeout=300 --timeout-method=signal --cov=. --cov-report=xml

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-3.12
          path: coverage.xml

  docker-validate:
    name: Docker build and smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build bot image
        run: docker build -f Dockerfile.bot -t tsdbot-bot:test .

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t tsdbot-backend:test .

      - name: Bot image runtime smoke
        run: docker run --rm --entrypoint python tsdbot-bot:test -c "import bot"

      - name: Backend image runtime smoke
        run: docker run --rm --entrypoint python tsdbot-backend:test -c "import app"
