repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
        # VS Code and TypeScript config files use JSONC (JSON-with-comments) which
        # is valid for those tools but fails strict JSON parsing. Exclude them here.
        exclude: >-
          (?x)^(
            \.vscode/.*\.json|
            web/backend/\.vscode/.*\.json|
            web/frontend/tsconfig\.json|
            web/frontend/tsconfig\.node\.json
          )$
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        types: [python]
        exclude: ^(tests/|web/backend/tests/|web/frontend/|backend/api/internal/test_)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-beautifulsoup4]
        args: [--config-file, pyproject.toml]
        # Exclude tests and bot.pyi (stub file — duplicate module collision with bot.py)
        exclude: ^(tests/|bot\.pyi$)

  - repo: local
    hooks:
      - id: python-modularity-check
        name: python-modularity-check
        entry: python3 tools/check_modularity.py --warn-lines 500 --fail-lines 700 --warn-funcs 15 --warn-classes 4
        language: system
        files: ^(?!tests/|web/backend/tests/).*\.py$
        pass_filenames: true
